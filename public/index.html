    <!--
      manifest.json provides metadata used when your web app is installed on a

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <form
      name="contact-form"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="phone" name="phone" />
      <input type="company" name="company" />
      <input type="address" name="address" />
      <input type="hidden" name="form-name" value="contact-form" />
      <input type="hidden" name="areas" value="crm" />
      <input type="hidden" name="areas" value="scouting" />
      <input type="hidden" name="areas" value="connecting" />
      <input type="hidden" name="areas" value="newGeographies" />
    </form>
    <div id="root"></div>
    <!-- Netlify detection forms -->
    <form name="spielpitch" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="role" />
    </form>
